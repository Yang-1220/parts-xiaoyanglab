<title>元器件认图卡</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--mut:#6b7280;--line:#e4e6ea;--acc:#c8102e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 48px;background:var(--bg);color:var(--ink);
 font:15px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
header h1{font-size:20px;margin:0 0 4px;letter-spacing:.01em}
.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:10px}
.bar .grow{flex:1}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
 background:#fff;color:var(--ink)}
button:active{transform:scale(.97)}
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:740px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{perspective:900px;height:214px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.3,1);
 transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;background:var(--card);border:1px solid var(--line);
 box-shadow:0 1px 2px rgba(15,20,30,.05);overflow:hidden;backface-visibility:hidden;
 -webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.front svg{width:100%;height:150px;display:block;margin-top:8px}
.front .hint{font-size:12px;color:#8a919c;text-align:center;padding:0 8px 10px;margin-top:auto;line-height:1.35}
.tag{position:absolute;top:8px;left:8px;font-size:10px;color:#6b7280;background:#f0f1f4;
 border-radius:6px;padding:1px 6px;letter-spacing:.03em}
.seen .front{box-shadow:inset 0 0 0 2px #d7f5e6}
.back{transform:rotateY(180deg);padding:13px 12px;overflow:auto}
.back h3{margin:0;font-size:15px}
.back .en{font-size:10.5px;color:var(--mut);letter-spacing:.02em}
.back ul{margin:6px 0 0;padding-left:15px;font-size:12px;line-height:1.45}
.back li{margin:2.5px 0}
.back li b{color:var(--acc);font-weight:600}
footer{margin-top:22px;color:var(--mut);font-size:12px;text-align:center}
.front img.ph{width:100%;height:150px;object-fit:contain;margin-top:8px;background:#fafbfc}
.noph{position:absolute;top:8px;right:8px;font-size:10px;color:#b45309;background:#fef3c7;border-radius:6px;padding:1px 6px}
.cred{margin:18px 2px 0;font-size:12px;color:#6b7280}
.cred summary{cursor:pointer}
.cred a{color:#2563eb}
.test{position:fixed;inset:0;background:#f4f5f7;z-index:80;display:none;flex-direction:column;
 padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
.thead{display:flex;align-items:center;gap:10px;font-size:13px;color:#6b7280;flex:0 0 auto}
.thead button{padding:5px 10px;font-size:12px}
.thead button.on{background:#15181d;color:#fff;border-color:#15181d}
.thead .grow{flex:1}
#ttime{font-weight:600;color:#15181d;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.tbar{height:4px;background:#e4e6ea;border-radius:2px;margin:10px 0 6px;overflow:hidden;flex:0 0 auto}
.tbar i{display:block;height:100%;width:100%;background:#15181d;transition:width .1s linear}
.tbar.warn i{background:#c8102e}
.tbody{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;overflow:auto;padding:4px 0}
.tcard{width:100%;max-width:430px;margin:0 auto;background:#fff;border:1px solid #e4e6ea;border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(15,20,30,.06)}
.tcard svg,.tcard img{width:100%;height:168px;display:block;object-fit:contain}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:430px;margin:0 auto}
.topt{padding:15px 8px;border-radius:12px;border:1px solid #e4e6ea;background:#fff;font-size:15px;line-height:1.3;color:#15181d;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px}
.topt:active{transform:scale(.98)}
.topt.ok{background:#e7f7ee;border-color:#2f9e5b;color:#1c6b3c;font-weight:600}
.topt.bad{background:#fdeaea;border-color:#c8102e;color:#a30f26}
.tans2{width:100%;max-width:430px;margin:0 auto;background:#fff;border:1px dashed #d7dbe0;border-radius:12px;padding:10px 12px;font-size:13px;color:#4b5563;line-height:1.45}
.tans2 b{color:#15181d;font-size:14px}
.tname{font-weight:600;margin-top:10px}
.tbig{font-size:26px;font-weight:600;margin:6px 0 2px}
.tsub{color:#6b7280;font-size:12.5px;margin-top:2px}
.tsub2{color:#6b7280;font-size:12px;margin-top:8px;text-align:left;line-height:1.5}
.tfoot{display:flex;gap:10px;padding-top:12px;flex:0 0 auto}
.tfoot:empty{display:none}
.tfoot button{flex:1;padding:15px;font-size:16px;border-radius:12px;border:1px solid #e4e6ea;background:#fff}
.tfoot button.tyes,.tyes{background:#15181d;color:#fff;border-color:#15181d}
.tfoot button.tno,.tno{color:#c8102e;border-color:#f0c9ce}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#6b7280;font-size:14px;z-index:200}
</style>
</head>

const LS=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}};}})();
const grid=document.getElementById('grid');
const prog=document.getElementById('prog');
const chips=document.getElementById('chips');
let filter='全部';
const seen=new Set(JSON.parse(LS.getItem('seen-cards')||'[]'));
const wrong=new Set(JSON.parse(LS.getItem('wrong-cards')||'[]'));
function saveWrong(){LS.setItem('wrong-cards',JSON.stringify([...wrong]));updateWrongBadge();}
function updateWrongBadge(){var b=document.querySelector('#chips button[data-f="错题"]');if(b)b.textContent='错题'+(wrong.size?' '+wrong.size:'');}
let order=CARDS.slice();

function makeCard(c){
  const el=document.createElement('div');
  el.className='card'+(seen.has(c.name)?' seen':'');
  const gi=CARDS.indexOf(c);
  const ph=PHOTOS[gi];
  const showPh=mode==='photo' && ph;
  const noPh=mode==='photo' && !ph;
  el.innerHTML='<div class="inner">'
    +'<div class="face front"><span class="tag">'+c.tag+'</span>'
    +(showPh?'<img class="ph" src="'+ph+'" alt="">':c.svg)
    +(noPh?'<span class="noph">暂无实拍</span>':'')
    +'<div class="hint">'+c.hint+'</div></div>'
    +'<div class="face back"><h3>'+c.name+'</h3><div class="en">'+c.en+'</div><ul>'
    +c.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>'
    +'</div>';
  el.addEventListener('click',()=>{
    el.classList.toggle('flip');
    if(el.classList.contains('flip')){
      if(!seen.has(c.name)){seen.add(c.name);save();el.classList.add('seen');}
      updateProg();
    }
  });
  return el;
}
var batchList=[],batchShown=0,BATCH=12;
function render(){
  grid.innerHTML='';
  batchList=order.filter(c=>filter==='全部'||(filter==='错题'?wrong.has(c.name):c.tag===filter));
  batchShown=0;
  appendBatch();
  updateProg();
}
function appendBatch(){
  var end=Math.min(batchShown+BATCH,batchList.length);
  for(var i=batchShown;i<end;i++){grid.appendChild(makeCard(batchList[i]));}
  batchShown=end;
}
window.addEventListener('scroll',function(){
  if(window.innerHeight+window.scrollY>document.body.offsetHeight-700){appendBatch();}
},{passive:true});
function save(){LS.setItem('seen-cards',JSON.stringify([...seen]));}
function updateProg(){prog.textContent='已翻 '+seen.size+' / '+CARDS.length;}

chips.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...chips.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  filter=b.dataset.f; render();
});
document.getElementById('shuffle').onclick=()=>{
  order=order.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); render();
};
document.getElementById('reset').onclick=()=>{ if(confirm('清空已翻记录和错题池？')){ seen.clear(); save(); wrong.clear(); saveWrong(); render(); } };
var mode=LS.getItem('img-mode')||'svg';
function paintMode(){document.getElementById('mode').textContent=mode==='photo'?'切到示意图':'切到实拍';}
document.getElementById('mode').onclick=()=>{
  mode=mode==='photo'?'svg':'photo';
  LS.setItem('img-mode',mode); paintMode(); render();
};
paintMode();
render();

/* ---------- 压力测试（四选一） ---------- */
var T={on:false,q:[],i:0,right:0,miss:0,shown:new Set(),curFirst:false,firstTotal:0,firstRight:0,
       missed:new Set(),limit:15000,tmr:null,start:0,t0:0,locked:false};
var hold=(LS.getItem('quiz-hold')==='1');
function $id(x){return document.getElementById(x);}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function startTest(onlyWrong){
  var pool=[];CARDS.forEach(function(c,i){if(!onlyWrong||wrong.has(c.name))pool.push(i);});
  if(!pool.length){$id('tmsg').textContent='错题库是空的';return;}
  $id('tmsg').textContent=onlyWrong?'只测错题':'全部 57 张';
  T.on=true;T.q=shuffleArr(pool.slice());T.i=0;T.right=0;T.miss=0;
  T.shown=new Set();T.missed=new Set();T.firstTotal=0;T.firstRight=0;T.t0=Date.now();
  $id('test').style.display='flex';document.body.style.overflow='hidden';
  showQ();
}
function endTest(){
  T.on=false;clearInterval(T.tmr);$id('test').style.display='none';
  document.body.style.overflow='';render();
}
function optionsFor(c,idx){
  var others=CARDS.filter(function(x,i){return i!==idx&&x.tag===c.tag;});
  if(others.length<3)others=CARDS.filter(function(x,i){return i!==idx;});
  var names=shuffleArr(others.slice()).slice(0,3).map(function(x){return x.name;});
  return shuffleArr(names.concat([c.name]));
}
function showQ(){
  var idx=T.q[T.i],c=CARDS[idx],ph=PHOTOS[idx];
  T.locked=false;
  T.curFirst=!T.shown.has(idx);
  if(T.curFirst){T.shown.add(idx);T.firstTotal++;}
  $id('tprog').textContent=(T.i+1)+' / '+T.q.length;
  var opts=optionsFor(c,idx);
  var html='<div class="tcard">'+(ph?'<img src="'+ph+'" alt="">':c.svg)+'</div><div class="topts">';
  opts.forEach(function(n){html+='<button class="topt" data-n="'+n.replace(/"/g,'&quot;')+'">'+n+'</button>';});
  html+='</div>';
  $id('tbody').innerHTML=html;
  $id('tfoot').innerHTML='';
  Array.prototype.forEach.call($id('tbody').querySelectorAll('.topt'),function(b){
    b.addEventListener('click',function(){answer(b.getAttribute('data-n'),b);});
  });
  $id('ttime').textContent='15.0s';
  $id('tbarfill').style.width='100%';
  $id('tbarfill').parentNode.classList.remove('warn');
  T.start=Date.now();clearInterval(T.tmr);T.tmr=setInterval(tick,100);
}
function tick(){
  var left=T.limit-(Date.now()-T.start);
  if(left<=0){clearInterval(T.tmr);$id('ttime').textContent='超时';$id('tbarfill').style.width='0%';answer(null,null);return;}
  $id('ttime').textContent=(left/1000).toFixed(1)+'s';
  $id('tbarfill').style.width=(left/T.limit*100)+'%';
  $id('tbarfill').parentNode.classList.toggle('warn',left<5000);
}
function answer(choice,btn){
  if(!T.on||T.locked)return;
  T.locked=true;clearInterval(T.tmr);
  var idx=T.q[T.i],c=CARDS[idx],ok=(choice===c.name);
  Array.prototype.forEach.call($id('tbody').querySelectorAll('.topt'),function(b){
    b.disabled=true;
    var n=b.getAttribute('data-n');
    if(n===c.name)b.classList.add('ok');
    else if(b===btn)b.classList.add('bad');
  });
  if(ok){
    T.right++;if(T.curFirst)T.firstRight++;
    wrong.delete(c.name);saveWrong();
    $id('ttime').textContent='对';
    setTimeout(nextQ,550);
  }else{
    T.miss++;T.missed.add(c.name);wrong.add(c.name);saveWrong();
    T.q.push(idx);
    $id('ttime').textContent=choice?'错':'超时';
    $id('tbody').insertAdjacentHTML('beforeend','<div class="tans2"><b>'+c.name+'</b> · '+c.hint+'<br>'+c.tips[0].replace(/<[^>]+>/g,'')+'</div>');
    if(hold){$id('tfoot').innerHTML='<button class="tyes" id="tnext">下一题</button>';}
    else setTimeout(nextQ,1600);
  }
}
function nextQ(){
  T.i++;
  if(T.i>=T.q.length){finishTest();return;}
  showQ();
}
function finishTest(){
  clearInterval(T.tmr);T.on=false;
  var total=Math.round((Date.now()-T.t0)/1000);
  var acc=T.firstTotal?Math.round(T.firstRight/T.firstTotal*100):0;
  var names=[...T.missed];
  $id('tbody').innerHTML='<div class="tcard"><div class="tname">本轮结束</div>'
    +'<div class="tbig">首答正确率 '+acc+'%</div>'
    +'<div class="tsub">'+T.firstRight+' / '+T.firstTotal+' 张一次答对 · 用时 '+fmtTime(total)+' · 答错 '+T.miss+' 次</div>'
    +(names.length?'<div class="tsub2">错题 '+names.length+' 张：'+names.join('、')+'</div>'
                  :'<div class="tsub2">全对，稳。</div>')+'</div>';
  $id('tfoot').innerHTML='<button class="tno" id="tretry">只测错题</button>'
    +'<button class="tyes" id="tagain">再来一轮</button><button class="tno" id="tclose2">返回</button>';
  $id('ttime').textContent='完成';$id('tbarfill').style.width='0%';
}
$id('tfoot').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='tretry')startTest(true);
  else if(b.id==='tagain')startTest(false);
  else if(b.id==='tnext')nextQ();
  else if(b.id==='tclose2')endTest();
});
$id('tclose').onclick=endTest;
$id('testbtn').onclick=function(){startTest(filter==='错题');};
function paintHold(){var b=$id('theld');b.textContent=hold?'答错：停住':'答错：自动';b.classList.toggle('on',hold);}
$id('theld').onclick=function(){hold=!hold;LS.setItem('quiz-hold',hold?'1':'0');paintHold();};
paintHold();
updateWrongBadge();


var bp=document.getElementById('boot');if(bp)bp.remove();
</script>
